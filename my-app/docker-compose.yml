version: "3"
services:
  backend:
    build: ./backend
    ports:
      - "5000:5000"
  frontend:
    image: nginx:alpine
    volumes:
      - ./frontend:/usr/share/nginx/html
    ports:
      - "8080:80"
FROM python:3.9-slim

WORKDIR /app

COPY app.py /app

RUN pip install flask

CMD ["python", "app.py"]
